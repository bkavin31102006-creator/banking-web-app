<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BankApp - Profile</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial,sans-serif;background:#f3f4f6;min-height:100vh;}nav{background:#1a56db;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}nav h1{color:white;font-size:16px;font-weight:700;}.nav-right button{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;}.profile-header{background:white;border-bottom:0.5px solid #e5e7eb;padding:24px 16px;text-align:center;}.avatar{width:64px;height:64px;border-radius:50%;background:#1a56db;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;font-weight:700;margin:0 auto 10px;}.pname{font-size:17px;font-weight:700;color:#111827;}.pemail{font-size:13px;color:#6b7280;margin-top:3px;}.body{padding:12px;}.section{background:white;border:0.5px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:12px;}.section-header{padding:12px 16px;font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;border-bottom:0.5px solid #f3f4f6;}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:0.5px solid #f3f4f6;}.row:last-child{border-bottom:none;}.row-label{font-size:13px;color:#111827;font-weight:500;}.row-val{font-size:13px;color:#6b7280;}.row-danger{font-size:13px;color:#c81e1e;font-weight:600;cursor:pointer;}.msg{text-align:center;font-size:13px;padding:10px;border-radius:8px;margin-bottom:10px;display:none;}.error{background:#fde8e8;color:#9b1c1c;display:block;}.success{background:#def7ec;color:#03543f;display:block;}.change-pw{display:none;padding:14px 16px;border-top:0.5px solid #f3f4f6;}.change-pw.show{display:block;}.change-pw input{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;color:#111827;outline:none;margin-bottom:8px;}.change-pw button{width:100%;padding:10px;background:#1a56db;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}.bottom-nav{display:flex;background:white;border-top:1px solid #e5e7eb;position:sticky;bottom:0;}.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;font-size:10px;color:#9ca3af;cursor:pointer;gap:3px;text-decoration:none;}.bnav-item.active{color:#1a56db;}.bnav-item svg{width:20px;height:20px;}</style></head><body><nav><h1>Profile</h1><div class="nav-right"><button onclick="logout()">Logout</button></div></nav><div class="profile-header"><div class="avatar" id="avatar">?</div><div class="pname" id="pname">Loading...</div><div class="pemail" id="pemail"></div></div><div class="body"><div id="msg" class="msg"></div><div class="section"><div class="section-header">Account details</div><div class="row"><span class="row-label">Full name</span><span class="row-val" id="dname">-</span></div><div class="row"><span class="row-label">Email</span><span class="row-val" id="demail">-</span></div><div class="row"><span class="row-label">Mobile</span><span class="row-val" id="dmobile">-</span></div><div class="row"><span class="row-label">Account number</span><span class="row-val" id="dacno">-</span></div><div class="row"><span class="row-label">Member since</span><span class="row-val" id="dsince">-</span></div></div><div class="section"><div class="section-header">Security</div><div class="row" onclick="togglePw()"><span class="row-label">Change password</span><span style="color:#6b7280;font-size:18px;">›</span></div><div class="change-pw" id="pwForm"><div id="pwmsg" class="msg"></div><input type="password" id="oldPw" placeholder="Current password"><input type="password" id="newPw" placeholder="New password"><input type="password" id="confirmPw" placeholder="Confirm new password"><button onclick="changePw()">Update password</button></div></div><div class="section"><div class="row" onclick="logout()"><span class="row-danger">Logout</span></div></div></div><div class="bottom-nav"><a class="bnav-item" href="dashboard.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a><a class="bnav-item" href="history.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05V4.05C17.39 4.59 20.5 8.58 19.96 12.97C19.5 16.61 16.64 19.5 13 19.93V21.93C18.5 21.38 22.5 16.5 21.95 11C21.5 6.25 17.73 2.5 13 2.05M11 2.06C9.05 2.25 7.19 3 5.67 4.26L7.1 5.74C8.22 4.84 9.57 4.26 11 4.06V2.06M4.26 5.67C3 7.19 2.25 9.04 2.05 11H4.05C4.24 9.58 4.8 8.23 5.69 7.1L4.26 5.67M2.06 13C2.26 14.96 3.03 16.81 4.27 18.33L5.69 16.9C4.81 15.77 4.24 14.42 4.06 13H2.06M7.06 18.37L5.67 19.74C7.18 21 9.04 21.79 11 22V20C9.58 19.82 8.23 19.25 7.06 18.37Z"/></svg>History</a><a class="bnav-item active" href="settings.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Profile</a></div><script>const token=localStorage.getItem("token");if(!token){location.href="index.html";}fetch("/api/auth/profile",{headers:{"Authorization":"Bearer "+token}}).then(r=>r.json()).then(d=>{const initials=d.name.split(" ").map(n=>n[0]).join("").toUpperCase();document.getElementById("avatar").textContent=initials;document.getElementById("pname").textContent=d.name;document.getElementById("pemail").textContent=d.email;document.getElementById("dname").textContent=d.name;document.getElementById("demail").textContent=d.email;document.getElementById("dmobile").textContent=d.mobile?d.mobile.slice(0,3)+"****"+d.mobile.slice(7):"N/A";document.getElementById("dacno").textContent=d.account_number_hidden;document.getElementById("dsince").textContent=new Date(d.created_at).toLocaleDateString("en-IN",{month:"long",year:"numeric"});}).catch(()=>location.href="index.html");function togglePw(){document.getElementById("pwForm").classList.toggle("show");}function changePw(){const oldPw=document.getElementById("oldPw").value;const newPw=document.getElementById("newPw").value;const confirmPw=document.getElementById("confirmPw").value;const msg=document.getElementById("pwmsg");if(!oldPw||!newPw||!confirmPw){msg.className="msg error";msg.textContent="Fill in all fields";return;}if(newPw!==confirmPw){msg.className="msg error";msg.textContent="Passwords do not match";return;}if(newPw.length<6){msg.className="msg error";msg.textContent="Password must be at least 6 characters";return;}fetch("/api/auth/changepassword",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({oldPassword:oldPw,newPassword:newPw})}).then(r=>r.json()).then(d=>{if(d.message==="Password updated"){msg.className="msg success";msg.textContent="Password updated successfully!";document.getElementById("oldPw").value="";document.getElementById("newPw").value="";document.getElementById("confirmPw").value="";}else{msg.className="msg error";msg.textContent=d.message;}});}function logout(){localStorage.clear();location.href="index.html";}</script></body></html>
