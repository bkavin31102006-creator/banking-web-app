<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NovaPay Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#081028;
      --sidebar:#0d1735;
      --card:#111c44;
      --card2:#152452;
      --accent:#00d09c;
      --text:#edf3ff;
      --muted:#90a0d9;
      --border:rgba(255,255,255,0.06);
    }

    body{
      font-family:'DM Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
    }

    .sidebar{
      width:260px;
      background:linear-gradient(180deg,#0b1437 0%,#101d49 100%);
      padding:30px 22px;
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      font-family:'Syne',sans-serif;
      font-size:2rem;
      font-weight:800;
      color:var(--accent);
      margin-bottom:40px;
    }

    .logo span{
      color:white;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .nav button{
      background:transparent;
      border:none;
      color:var(--muted);
      text-align:left;
      padding:14px 18px;
      border-radius:14px;
      font-size:0.95rem;
      cursor:pointer;
      transition:0.25s;
      font-family:'DM Sans',sans-serif;
    }

    .nav button:hover{
      background:rgba(0,208,156,0.12);
      color:white;
      transform:translateX(4px);
    }

    .logout{
      background:#ff4d67 !important;
      color:white !important;
    }

    .main{
      flex:1;
      padding:34px;
      overflow-y:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:28px;
    }

    .welcome h1{
      font-family:'Syne',sans-serif;
      font-size:2rem;
      margin-bottom:6px;
    }

    .welcome p{
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:24px;
      margin-bottom:26px;
    }

    .card{
      background:linear-gradient(145deg,var(--card),var(--card2));
      border-radius:24px;
      padding:24px;
      border:1px solid var(--border);
      box-shadow:0 15px 35px rgba(0,0,0,0.25);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .balance-card{
      grid-column:span 2;
      position:relative;
      overflow:hidden;
    }

    .balance-card::before{
      content:'';
      position:absolute;
      width:220px;
      height:220px;
      background:rgba(0,208,156,0.08);
      border-radius:50%;
      top:-80px;
      right:-80px;
    }

    .label{
      color:var(--muted);
      font-size:0.85rem;
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .balance{
      font-size:3rem;
      font-weight:700;
      font-family:'Syne',sans-serif;
      margin-bottom:14px;
    }

    .acc{
      color:#b8c7ff;
      font-size:0.95rem;
    }

    .profile-info{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .info-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid rgba(255,255,255,0.05);
      padding-bottom:10px;
    }

    .info-row span:first-child{
      color:var(--muted);
    }

    .actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      margin-top:20px;
    }

    .action-btn{
      border:none;
      border-radius:18px;
      padding:18px;
      background:rgba(255,255,255,0.04);
      color:white;
      cursor:pointer;
      transition:0.25s;
      font-size:0.95rem;
      font-weight:600;
    }

    .action-btn:hover{
      background:var(--accent);
      color:#081028;
      transform:translateY(-3px);
    }

    .transactions{
      margin-top:30px;
    }

    .transactions h2{
      margin-bottom:20px;
      font-family:'Syne',sans-serif;
    }

    .transaction-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .transaction{
      background:var(--card);
      border:1px solid var(--border);
      padding:18px;
      border-radius:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition:0.25s;
    }

    .transaction:hover{
      transform:translateX(4px);
    }

    .type{
      font-weight:700;
      margin-bottom:5px;
      text-transform:capitalize;
    }

    .date{
      color:var(--muted);
      font-size:0.82rem;
    }

    .amount{
      font-weight:700;
      font-size:1rem;
    }

    .deposit{
      color:#00d09c;
    }

    .withdrawal{
      color:#ff5d73;
    }

    .transfer{
      color:#5ca8ff;
    }

    @media(max-width:900px){

      body{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }

      .balance-card{
        grid-column:span 1;
      }

      .actions{
        grid-template-columns:1fr;
      }
      #toggleAccBtn{
        margin-left:12px;
        background:rgba(255,255,255,0.08);
        border:none;
        color:white;
        padding:6px 12px;
        border-radius:10px;
        cursor:pointer;
      }  
      .profile-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:20px;
}

.profile-grid div{
  background:rgba(255,255,255,0.03);
  padding:18px;
  border-radius:18px;
}

.profile-grid h4{
  margin-bottom:8px;
  color:#90a0d9;
} 
    }
  </style>
</head>

<body>

  <div class="sidebar">

    <div>

      <div class="logo">
        Nova<span>Pay</span>
      </div>

      <div class="nav">
        <button>Dashboard</button>
        <button>Deposit</button>
        <button>Withdraw</button>
        <button>Transfer</button>
        <button>Transactions</button>
      </div>

    </div>

    <button class="nav logout" onclick="logout()">
      Logout
    </button>

  </div>

  <div class="main">

    <div class="topbar">
      <div class="welcome">
        <h1 id="welcomeName">Welcome</h1>
        <p>Manage your banking activities securely.</p>
      </div>
    </div>

    <div class="grid">

      <div class="card balance-card">
        <div class="label">Available Balance</div>
        <div class="balance" id="balance">₹0</div>
        <div class="acc">
          Account Number:
          <span id="accountNumber">••••••••</span>
          <button id="toggleAccBtn" onclick="toggleAccountNumber()">
          Show
          </button>
        </div>
      </div>
      <div class="card profile-card">

          <div class="label">Account Profile</div>

      <div class="profile-grid">

      <div>
      <h4>Full Name</h4>
      <p id="profileName"></p>
    </div>

    <div>
      <h4>Email</h4>
      <p id="profileEmail"></p>
    </div>

    <div>
      <h4>Phone Number</h4>
      <p id="profilePhone"></p>
    </div>

    <div>
      <h4>Account Type</h4>
      <p>Savings Account</p>
    </div>

  </div>

</div>

      <div class="card">

        <div class="label">Profile Information</div>

        <div class="profile-info">

          <div class="info-row">
            <span>Name</span>
            <span id="name"></span>
          </div>

          <div class="info-row">
            <span>Email</span>
            <span id="email"></span>
          </div>

          <div class="info-row">
            <span>Phone</span>
            <span id="phone"></span>
          </div>

          <div class="info-row">
            <span>Joined</span>
            <span id="joined"></span>
          </div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="label">Quick Actions</div>

      

       <div class="actions">

         <button class="action-btn" onclick="depositMoney()">
          Deposit
         </button>

         <button class="action-btn" onclick="withdrawMoney()">
          Withdraw
         </button>

         <button class="action-btn" onclick="transferMoney()">
          Transfer
         </button>

</div>

      </div>

    </div>

    <div class="transactions">

      <h2>Recent Transactions</h2>

      <div class="transaction-list" id="transactionList">

      </div>

    </div>

  </div>

<script>
    

    let realAccountNumber = '';
    let visible = false;

    const API = 'http://localhost:5000/api/auth';

async function loadProfile(){

  const token = localStorage.getItem('token');

  if(!token){
    window.location.href = 'login.html';
    return;
  }

  try{

    const res = await fetch(API + '/profile', {
      headers:{
        Authorization:'Bearer ' + token
      }
    });

    const data = await res.json();

    document.getElementById('welcomeName').innerText =
      'Welcome, ' + data.name;

    document.getElementById('name').innerText =
      data.name;

    document.getElementById('email').innerText =
      data.email;

    document.getElementById('phone').innerText =
      data.phone;

    document.getElementById('balance').innerText =
      '₹' + Number(data.balance).toLocaleString();

    document.getElementById('joined').innerText =
      new Date(data.created_at).toLocaleDateString();

    document.getElementById('profileName').innerText =
      data.name;

    document.getElementById('profileEmail').innerText =
      data.email;

    document.getElementById('profilePhone').innerText =
      data.phone;

    realAccountNumber = data.account_number;

    document.getElementById('accountNumber').innerText =
      '••••••' + data.account_number.slice(-4);

  }catch(err){

    console.log(err);

  }

}

async function loadTransactions(){

  const token = localStorage.getItem('token');

  try{

    const res = await fetch(API + '/transactions', {
      headers:{
        Authorization:'Bearer ' + token
      }
    });

    const data = await res.json();

    const list = document.getElementById('transactionList');

    if(data.length === 0){

      list.innerHTML =
      '<p style="color:#90a0d9;">No transactions yet.</p>';

      return;

    }

    list.innerHTML = '';

    data.slice(0,10).forEach(tx => {

      list.innerHTML += `

      <div class="transaction">

        <div>

          <div class="type ${tx.type}">
            ${tx.type}
          </div>

          <div class="date">
            ${new Date(tx.created_at).toLocaleString()}
          </div>

        </div>

        <div class="amount ${tx.type}">
          ₹${tx.amount}
        </div>

      </div>

      `;

    });

  }catch(err){

    console.log(err);

  }

}

async function depositMoney(){

  const amount = prompt('Enter deposit amount');

  if(!amount || amount <= 0){
    return;
  }

  const token = localStorage.getItem('token');

  try{

    const res = await fetch(API + '/deposit', {

      method:'POST',

      headers:{
        'Content-Type':'application/json',
        Authorization:'Bearer ' + token
      },

      body:JSON.stringify({
        amount
      })

    });

    const data = await res.json();

    if(res.ok){

      alert('Deposit Successful');

      loadProfile();
      loadTransactions();

    }else{

      alert(data.message);

    }

  }catch(err){

    alert('Server Error');

  }

}

async function withdrawMoney(){

  const amount = prompt('Enter withdrawal amount');

  if(!amount || amount <= 0){
    return;
  }

  const token = localStorage.getItem('token');

  try{

    const res = await fetch(API + '/withdraw', {

      method:'POST',

      headers:{
        'Content-Type':'application/json',
        Authorization:'Bearer ' + token
      },

      body:JSON.stringify({
        amount
      })

    });

    const data = await res.json();

    if(res.ok){

      alert('Withdrawal Successful');

      loadProfile();
      loadTransactions();

    }else{

      alert(data.message);

    }

  }catch(err){

    alert('Server Error');

  }

}

async function transferMoney(){

  const recipient = prompt('Enter recipient phone number');

  const amount = prompt('Enter transfer amount');

  if(!recipient || !amount || amount <= 0){
    return;
  }

  const token = localStorage.getItem('token');

  try{

    const res = await fetch(API + '/transfer', {

      method:'POST',

      headers:{
        'Content-Type':'application/json',
        Authorization:'Bearer ' + token
      },

      body:JSON.stringify({
        recipient_phone:recipient,
        amount
      })

    });

    const data = await res.json();

    if(res.ok){

      alert('Transfer Successful');

      loadProfile();
      loadTransactions();

    }else{

      alert(data.message);

    }

  }catch(err){

    alert('Server Error');

  }

}

function toggleAccountNumber(){

  visible = !visible;

  const acc = document.getElementById('accountNumber');

  const btn = document.getElementById('toggleAccBtn');

  if(visible){

    acc.innerText = realAccountNumber;

    btn.innerText = 'Hide';

  }else{

    acc.innerText =
      '••••••' + realAccountNumber.slice(-4);

    btn.innerText = 'Show';

  }

}

function logout(){

  localStorage.removeItem('token');

  window.location.href = 'login.html';

}

loadProfile();
loadTransactions();

</script>



</body>
</html>
