<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NovaPay — Register</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>

    :root{
      --emerald:#00c896;
      --navy:#0b1437;
      --navy-mid:#112055;
      --card:#131e45;
      --text:#e8f0fe;
      --muted:#7b8fc4;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'DM Sans',sans-serif;
      background:var(--navy);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }

    .page{
      display:flex;
      width:100%;
      max-width:960px;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 40px 100px rgba(0,0,0,0.5);
      margin:24px;
    }

    .left{
      flex:1;
      background:linear-gradient(145deg,#0b1437 0%,#112055 50%,#1a3a6e 100%);
      padding:56px 48px;
      color:white;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .brand{
      font-family:'Syne',sans-serif;
      font-size:2rem;
      font-weight:800;
      color:var(--emerald);
    }

    .brand span{
      color:white;
    }

    .steps{
      display:flex;
      flex-direction:column;
      gap:24px;
    }

    .step{
      display:flex;
      gap:16px;
    }

    .step-num{
      width:36px;
      height:36px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--emerald),#00b4d8);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#0b1437;
      font-weight:700;
    }

    .step-text h4{
      margin-bottom:5px;
    }

    .step-text p{
      color:var(--muted);
      font-size:0.9rem;
    }

    .right{
      flex:1.1;
      background:var(--card);
      padding:56px 48px;
      color:white;
    }

    .right h3{
      font-family:'Syne',sans-serif;
      font-size:2rem;
      margin-bottom:8px;
    }

    .sub{
      color:var(--muted);
      margin-bottom:30px;
    }

    .form-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      color:var(--muted);
      font-size:0.8rem;
      text-transform:uppercase;
    }

    input{
      width:100%;
      background:var(--navy-mid);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;
      padding:14px;
      color:white;
      outline:none;
      font-size:0.95rem;
    }

    input:focus{
      border-color:var(--emerald);
    }

    .strength-wrapper{
      width:100%;
      height:8px;
      background:rgba(255,255,255,0.08);
      border-radius:20px;
      overflow:hidden;
      margin-top:10px;
    }

    #strengthBar{
      width:0%;
      height:100%;
      border-radius:20px;
      transition:0.3s;
    }

    #strengthText{
      margin-top:8px;
      color:var(--muted);
      font-size:0.85rem;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,var(--emerald),#00b4d8);
      color:#0b1437;
      font-family:'Syne',sans-serif;
      font-weight:700;
      cursor:pointer;
      margin-top:20px;
      font-size:1rem;
    }

    .msg{
      display:none;
      margin-bottom:18px;
      padding:12px;
      border-radius:10px;
      font-size:0.9rem;
    }

    .msg.error{
      background:rgba(255,0,0,0.1);
      color:#ff6b6b;
    }

    .msg.success{
      background:rgba(0,255,150,0.1);
      color:#00d09c;
    }

    .switch{
      margin-top:20px;
      text-align:center;
      color:var(--muted);
    }

    .switch a{
      color:var(--emerald);
      text-decoration:none;
    }

    @media(max-width:700px){

      .left{
        display:none;
      }

      .right{
        padding:40px 28px;
      }

    }

  </style>

</head>

<body>

  <div class="page">

    <div class="left">

      <div class="brand">
        Nova<span>Pay</span>
      </div>

      <div class="steps">

        <div class="step">
          <div class="step-num">1</div>

          <div class="step-text">
            <h4>Create account</h4>
            <p>Securely register your banking profile.</p>
          </div>
        </div>

        <div class="step">
          <div class="step-num">2</div>

          <div class="step-text">
            <h4>Login instantly</h4>
            <p>Access your account securely.</p>
          </div>
        </div>

        <div class="step">
          <div class="step-num">3</div>

          <div class="step-text">
            <h4>Manage finances</h4>
            <p>Deposit, transfer and monitor transactions.</p>
          </div>
        </div>

      </div>

      <div>
        NovaPay © 2025
      </div>

    </div>

    <div class="right">

      <h3>Create account</h3>

      <p class="sub">
        Join NovaPay in seconds
      </p>

      <div class="msg" id="msg"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Alice Johnson">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="alice@example.com">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="9876543210">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters">
      </div>

      <div class="strength-wrapper">
        <div id="strengthBar"></div>
      </div>

      <p id="strengthText"></p>

      <button class="btn" onclick="register()">
        Create Account
      </button>

      <div class="switch">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>

    </div>

  </div>

<script>

const passwordInput = document.getElementById('password');
const strengthBar = document.getElementById('strengthBar');
const strengthText = document.getElementById('strengthText');

passwordInput.addEventListener('input', checkPasswordStrength);

function checkPasswordStrength(){

  const password = passwordInput.value;

  let score = 0;

  if(password.length >= 6) score++;

  if(/[A-Z]/.test(password)) score++;

  if(/[0-9]/.test(password)) score++;

  if(/[^A-Za-z0-9]/.test(password)) score++;

  if(password.length === 0){

    strengthBar.style.width = '0%';
    strengthText.innerText = '';
    return;

  }

  if(score === 1){

    strengthBar.style.width = '25%';
    strengthBar.style.background = '#ff4d67';
    strengthText.innerText = 'Weak Password';

  }else if(score === 2){

    strengthBar.style.width = '50%';
    strengthBar.style.background = '#ffb347';
    strengthText.innerText = 'Medium Password';

  }else if(score === 3){

    strengthBar.style.width = '75%';
    strengthBar.style.background = '#5ca8ff';
    strengthText.innerText = 'Strong Password';

  }else{

    strengthBar.style.width = '100%';
    strengthBar.style.background = '#00d09c';
    strengthText.innerText = 'Very Strong Password';

  }

}

async function register(){

  const name = document.getElementById('name').value.trim();

  const email = document.getElementById('email').value.trim();

  const phone = document.getElementById('phone').value.trim();

  const password = document.getElementById('password').value;

  if(!name || !email || !phone || !password){

    showMsg('Please fill all fields','error');
    return;

  }

  try{

    const res = await fetch(
      'http://localhost:5000/api/auth/register',
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json'
        },

        body:JSON.stringify({
          name,
          email,
          phone,
          password
        })
      }
    );

    const data = await res.json();

    if(res.ok){

      showMsg('Account created successfully!','success');

      setTimeout(() => {

        window.location.href = 'login.html';

      },1500);

    }else{

      showMsg(data.message || 'Registration failed','error');

    }

  }catch(err){

    showMsg('Cannot connect to server','error');

  }

}

function showMsg(text,type){

  const msg = document.getElementById('msg');

  msg.textContent = text;

  msg.className = 'msg ' + type;

  msg.style.display = 'block';

}

document.addEventListener('keydown', e => {

  if(e.key === 'Enter'){

    register();

  }

});

</script>

</body>
</html>
