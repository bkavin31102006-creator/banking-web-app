<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BankApp - History</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial,sans-serif;background:#f3f4f6;min-height:100vh;}nav{background:#1a56db;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}nav h1{color:white;font-size:16px;font-weight:700;}.nav-right button{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;}.body{padding:12px;}.card{background:white;border:0.5px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:12px;}.card-title{padding:14px 16px;font-size:14px;font-weight:700;color:#111827;border-bottom:0.5px solid #f3f4f6;}.filter-row{display:flex;gap:8px;padding:12px 16px;border-bottom:0.5px solid #f3f4f6;overflow-x:auto;}.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid #e5e7eb;background:white;font-size:12px;color:#6b7280;cursor:pointer;white-space:nowrap;}.filter-btn.active{background:#1a56db;color:white;border-color:#1a56db;}.tx-list{padding:0 14px;}.tx-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid #f3f4f6;}.tx-item:last-child{border-bottom:none;}.tx-left{display:flex;align-items:center;gap:10px;}.tx-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}.tx-icon.dep{background:#d1fae5;}.tx-icon.with{background:#fee2e2;}.tx-icon.tin{background:#dbeafe;}.tx-icon.tout{background:#ede9fe;}.tx-icon svg{width:17px;height:17px;}.tx-name{font-size:13px;font-weight:600;color:#111827;}.tx-date{font-size:11px;color:#9ca3af;margin-top:2px;}.tx-amt{font-size:14px;font-weight:700;white-space:nowrap;}.tx-amt.pos{color:#057a55;}.tx-amt.neg{color:#c81e1e;}.empty{text-align:center;color:#9ca3af;padding:32px;font-size:13px;}.bottom-nav{display:flex;background:white;border-top:1px solid #e5e7eb;position:sticky;bottom:0;}.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;font-size:10px;color:#9ca3af;cursor:pointer;gap:3px;text-decoration:none;}.bnav-item.active{color:#1a56db;}.bnav-item svg{width:20px;height:20px;}</style></head><body><nav><h1>Transaction History</h1><div class="nav-right"><button onclick="logout()">Logout</button></div></nav><div class="body"><div class="card"><div class="card-title">All transactions</div><div class="filter-row"><button class="filter-btn active" onclick="filter('all',this)">All</button><button class="filter-btn" onclick="filter('deposit',this)">Deposits</button><button class="filter-btn" onclick="filter('withdrawal',this)">Withdrawals</button><button class="filter-btn" onclick="filter('transfer_in',this)">Received</button><button class="filter-btn" onclick="filter('transfer_out',this)">Sent</button></div><div class="tx-list" id="txList"><div class="empty">Loading...</div></div></div></div><div class="bottom-nav"><a class="bnav-item" href="dashboard.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a><a class="bnav-item active" href="history.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05V4.05C17.39 4.59 20.5 8.58 19.96 12.97C19.5 16.61 16.64 19.5 13 19.93V21.93C18.5 21.38 22.5 16.5 21.95 11C21.5 6.25 17.73 2.5 13 2.05M11 2.06C9.05 2.25 7.19 3 5.67 4.26L7.1 5.74C8.22 4.84 9.57 4.26 11 4.06V2.06M4.26 5.67C3 7.19 2.25 9.04 2.05 11H4.05C4.24 9.58 4.8 8.23 5.69 7.1L4.26 5.67M2.06 13C2.26 14.96 3.03 16.81 4.27 18.33L5.69 16.9C4.81 15.77 4.24 14.42 4.06 13H2.06M7.06 18.37L5.67 19.74C7.18 21 9.04 21.79 11 22V20C9.58 19.82 8.23 19.25 7.06 18.37Z"/></svg>History</a><a class="bnav-item" href="settings.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Profile</a></div><script>const token=localStorage.getItem("token");if(!token){location.href="index.html";}let allTx=[];function txIcon(type){if(type==="deposit")return'<div class="tx-icon dep"><svg viewBox="0 0 24 24" fill="#057a55"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg></div>';if(type==="withdrawal")return'<div class="tx-icon with"><svg viewBox="0 0 24 24" fill="#c81e1e"><path d="M5 11h11.17l-4.88-4.88c-.39-.39-.39-1.03 0-1.42.39-.39 1.02-.39 1.41 0l6.59 6.59c.39.39.39 1.02 0 1.41l-6.59 6.59c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41L16.17 13H5c-.55 0-1-.45-1-1s.45-1 1-1z"/></svg></div>';if(type==="transfer_in")return'<div class="tx-icon tin"><svg viewBox="0 0 24 24" fill="#1a56db"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg></div>';return'<div class="tx-icon tout"><svg viewBox="0 0 24 24" fill="#7c3aed"><path d="M5 11h11.17l-4.88-4.88c-.39-.39-.39-1.03 0-1.42.39-.39 1.02-.39 1.41 0l6.59 6.59c.39.39.39 1.02 0 1.41l-6.59 6.59c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41L16.17 13H5c-.55 0-1-.45-1-1s.45-1 1-1z"/></svg></div>';}function render(list){const el=document.getElementById("txList");if(!list.length){el.innerHTML='<div class="empty">No transactions found</div>';return;}el.innerHTML=list.map(t=>{const pos=t.type==="deposit"||t.type==="transfer_in";const sign=pos?"+":"-";const cls=pos?"pos":"neg";const date=new Date(t.created_at).toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});return'<div class="tx-item"><div class="tx-left">'+txIcon(t.type)+'<div><div class="tx-name">'+t.description+'</div><div class="tx-date">'+date+'</div></div></div><div class="tx-amt '+cls+'">'+sign+"₹"+parseFloat(t.amount).toLocaleString("en-IN")+'</div></div>';}).join("");}function filter(type,btn){document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render(type==="all"?allTx:allTx.filter(t=>t.type===type));}fetch("/api/auth/transactions",{headers:{"Authorization":"Bearer "+token}}).then(r=>r.json()).then(data=>{allTx=data;render(allTx);}).catch(()=>location.href="index.html");function logout(){localStorage.clear();location.href="index.html";}</script></body></html>
